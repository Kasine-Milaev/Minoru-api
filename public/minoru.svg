<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Minoru">
  <defs>
    <radialGradient id="bg" cx="28%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3a1519"/>
      <stop offset="0.55" stop-color="#150d0f"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6e8d2"/>
      <stop offset="0.38" stop-color="#ff5a66"/>
      <stop offset="1" stop-color="#b3202e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efdcc3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#efdcc3" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="mclip"><path d="M96 392 L96 120 L172 120 L256 248 L340 120 L416 120 L416 392 L340 392 L340 236 L280 326 L232 326 L172 236 L172 392 Z"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
